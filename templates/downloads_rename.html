{% extends "base.html" %}

{% block title %}Datei umbenennen - Matchtreff Padel{% endblock %}

{% block content %}
<div class="dl-head">
    <h1>Datei umbenennen</h1>
    <p style="opacity: 0.85;">Neuen Namen für <strong>{{ filename }}</strong> eingeben</p>
</div>

<div class="dl-card" style="max-width: 500px; margin: 0 auto;">
    <form method="post" action="{{ url_for('downloads_rename_page', filename=filename) }}">
        <div style="margin-bottom: 1rem;">
            <label for="new_name" class="form-label">Neuer Dateiname</label>
            <input type="text" id="new_name" name="new_name" class="form-control" value="{{ filename }}" required autofocus>
            <small style="opacity: 0.7;">Behalte die Dateiendung bei (z. B. .pdf, .jpg, .apk)</small>
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
            <a href="{{ url_for('downloads') }}" class="btn-secondary btn-sm">Abbrechen</a>
            <button type="submit" class="btn-accent btn-sm">Speichern</button>
        </div>
    </form>
</div>
{% endblock %}
